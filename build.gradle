plugins {
	id 'groovy-gradle-plugin'
	id 'java-gradle-plugin'
	id 'jacoco'
	id 'org.flowdigger.maven-publish'
	id 'checkstyle'
	id 'com.gradle.plugin-publish' version '2.2.1'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'org.flowdigger.dependency-check'
	id 'com.github.spotbugs' version '6.5.13'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'org.flowdigger.gradle'
version = '1.0.2'

checkstyle {
	toolVersion = '10.26.1'
	configFile = file('checkstyle.xml')
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

subprojects {
	apply plugin: 'groovy'
	repositories {
		mavenCentral()
	}
	dependencies {
		implementation gradleApi()
		implementation localGroovy()
	}
}

dependencies {
	implementation project(':pipeline:step1-parse')
	implementation project(':pipeline:step2-observe')
	implementation project(':pipeline:step3-direct-flow')
	implementation project(':pipeline:step4-validate-direct-flow')
	implementation project(':pipeline:step5-merge')
	implementation project(':pipeline:step6-stitch')
	implementation project(':pipeline:step7-validate-lineage')
	implementation project(':pipeline:step8-export')
	implementation project(':pipeline:step9-publish')

	testImplementation gradleTestKit()
	testImplementation localGroovy()
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	executionData(fileTree(layout.buildDirectory) {
		include 'jacoco/*.exec'
	})
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register('coverage') {
	group = 'verification'
	description = 'Runs tests and generates JaCoCo coverage reports.'
	dependsOn tasks.named('jacocoTestReport')
}

spotless {
	def hasOriginMain = providers.exec {
		commandLine 'git', 'show-ref', '--verify', '--quiet', 'refs/remotes/origin/main'
		ignoreExitValue = true
	}.result.get().exitValue == 0
	ratchetFrom(hasOriginMain ? 'origin/main' : 'HEAD')

	format('misc') {
		target '*.gradle', '.gitattributes', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}

	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

plugins.withId('com.github.spotbugs') {
	dependencies {
		spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
	}

	tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
		ignoreFailures = providers.gradleProperty('spotbugsIgnoreFailures')
				.map { it.toBoolean() }
				.orElse(true)
				.get()
		effort = com.github.spotbugs.snom.Effort.DEFAULT
		reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
		excludeFilter = file('spotbugs-exclude.xml')
		reports.create('html').required = true
		reports.create('xml').required = false
	}
}

gradlePlugin {
	website = 'https://github.com/flowdigger/gradle-lineage-plugin'
	vcsUrl = 'https://github.com/flowdigger/gradle-lineage-plugin.git'
	plugins {
		lineageConventions {
			id = 'org.flowdigger.lineage'
			implementationClass = 'org.flowdigger.gradle.lineage.LineageConventionsPlugin'
			displayName = 'Lineage pipeline conventions plugin'
			description = 'Externalized and parameterized conventions for the 1.parse..9.publish lineage pipeline.'
			tags.set([
				'lineage',
				'sql',
				'java',
				'graphml',
				'rdf',
				'gradle-plugin',
				'pipeline'
			])
		}
	}
}

def signingKeyProvider = providers.gradleProperty('flowdigger.signing.key')
		.orElse(providers.environmentVariable('SIGNING_KEY'))
		.orElse(providers.gradleProperty('signingKey'))
def signingPasswordProvider = providers.gradleProperty('flowdigger.signing.password')
		.orElse(providers.environmentVariable('SIGNING_PASSWORD'))
		.orElse(providers.gradleProperty('signingPassword'))
def hasSigningMaterial = signingKeyProvider.present && signingPasswordProvider.present
tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
	onlyIf { hasSigningMaterial }
}

publishing {
	publications.withType(MavenPublication).configureEach {
		pom {
			name = 'Lineage pipeline conventions plugin'
			description = 'Externalized and parameterized conventions for 1.parse..9.publish lineage pipeline'
			url = 'https://github.com/flowdigger/gradle-lineage-plugin'

			licenses {
				license {
					name = 'MIT License'
					url = 'https://opensource.org/licenses/MIT'
				}
			}

			developers {
				developer {
					id = 'flowdigger'
					name = 'Flowdigger'
				}
			}

			scm {
				connection = 'scm:git:https://github.com/flowdigger/gradle-lineage-plugin.git'
				developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-lineage-plugin.git'
				url = 'https://github.com/flowdigger/gradle-lineage-plugin'
			}
		}
	}
}
