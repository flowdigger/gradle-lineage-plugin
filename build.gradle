plugins {
	id 'groovy-gradle-plugin'
	id 'java-gradle-plugin'
	id 'jacoco'
	id 'maven-publish'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'com.github.spotbugs' version '6.5.13' apply false
	id 'com.diffplug.spotless' version '8.10.4'
    id 'signing'
}

group = 'org.flowdigger.gradle'
version = '0.1.0'

def enableSpotbugs = gradle.startParameter.taskNames
		.collect { it.toLowerCase() }
		.any { it.contains('spotbugs') || it.endsWith('allsecuritychecks') }

if (enableSpotbugs) {
	apply plugin: 'com.github.spotbugs'
}

repositories {
	gradlePluginPortal()
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

subprojects {
	apply plugin: 'groovy'
	repositories {
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		implementation gradleApi()
		implementation localGroovy()
	}
}

dependencies {
	implementation project(':pipeline:step1-parse')
	implementation project(':pipeline:step2-observe')
	implementation project(':pipeline:step3-direct-flow')
	implementation project(':pipeline:step4-validate-direct-flow')
	implementation project(':pipeline:step5-merge')
	implementation project(':pipeline:step6-stitch')
	implementation project(':pipeline:step7-validate-lineage')
	implementation project(':pipeline:step8-export')
	implementation project(':pipeline:step9-publish')

	testImplementation gradleTestKit()
	testImplementation localGroovy()
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	executionData(fileTree(layout.buildDirectory) {
		include 'jacoco/*.exec'
	})
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register('coverage') {
	group = 'verification'
	description = 'Runs tests and generates JaCoCo coverage reports.'
	dependsOn tasks.named('jacocoTestReport')
}

spotless {
	def hasOriginMain = providers.exec {
		commandLine 'git', 'show-ref', '--verify', '--quiet', 'refs/remotes/origin/main'
		ignoreExitValue = true
	}.result.get().exitValue == 0
	ratchetFrom(hasOriginMain ? 'origin/main' : 'HEAD')

	format('misc') {
		target '*.gradle', '.gitattributes', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}

	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

dependencyCheck {
	formats = ['HTML', 'JSON', 'XML']
	failBuildOnCVSS = 7.0f
	skipConfigurations = ['spotbugs', 'spotbugsPlugins']

	if (file('dependency-check-suppressions.xml').exists()) {
		suppressionFile = file('dependency-check-suppressions.xml').absolutePath
	}

	nvd {
		apiKey = providers.gradleProperty('org.owasp.dependencycheck.nvd.api.key').orNull
				?: System.getenv('NVD_API_KEY')
	}
}

plugins.withId('com.github.spotbugs') {
	dependencies {
		spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
	}

	tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
		ignoreFailures = providers.gradleProperty('spotbugsIgnoreFailures')
				.map { it.toBoolean() }
				.orElse(true)
				.get()
		effort = com.github.spotbugs.snom.Effort.DEFAULT
		reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
		excludeFilter = file('spotbugs-exclude.xml')
		reports.create('html').required = true
		reports.create('xml').required = false
	}
}

gradlePlugin {
	website = 'https://github.com/jurgenei/gradle-lineage-plugin'
	vcsUrl = 'https://github.com/jurgenei/gradle-lineage-plugin.git'
	plugins {
		lineageConventions {
			id = 'org.flowdigger.gradle.lineage'
			implementationClass = 'org.flowdigger.gradle.lineage.LineageConventionsPlugin'
			displayName = 'Lineage pipeline conventions plugin'
			description = 'Externalized and parameterized conventions for the 1.parse..9.publish lineage pipeline.'
			tags.set([
				'lineage',
				'sql',
				'java',
				'graphml',
				'rdf',
				'gradle-plugin',
				'pipeline'
			])
		}
	}
}


signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull

    if (signingKey && signingPassword) {
        if (signingKeyId) {
            useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }

    sign publishing.publications
}


import org.gradle.api.GradleException
import java.security.MessageDigest

def centralArtifactId = (project.findProperty('mavenArtifactId') ?: project.name).toString()
def centralGroupPath = project.group.toString().replace('.', '/')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')

    def artifactBaseDir = file("${System.getProperty('user.home')}/.m2/repository/${centralGroupPath}/${centralArtifactId}")
    def artifactVersionDir = file("${artifactBaseDir}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}"))

    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')

    doLast {
        def stagedVersionDir = layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}").get().asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }

        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
