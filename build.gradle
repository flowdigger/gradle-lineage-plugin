plugins {
	id 'groovy-gradle-plugin'
	id 'java-gradle-plugin'
	id 'jacoco'
	id 'maven-publish'
	id 'signing'
	id 'checkstyle'
	id 'com.gradle.plugin-publish' version '2.2.1'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'com.github.spotbugs' version '6.5.13'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'org.flowdigger.gradle'
version = '1.0.1'

checkstyle {
	toolVersion = '10.26.1'
	configFile = file('checkstyle.xml')
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

subprojects {
	apply plugin: 'groovy'
	repositories {
		mavenCentral()
	}
	dependencies {
		implementation gradleApi()
		implementation localGroovy()
	}
}

dependencies {
	implementation project(':pipeline:step1-parse')
	implementation project(':pipeline:step2-observe')
	implementation project(':pipeline:step3-direct-flow')
	implementation project(':pipeline:step4-validate-direct-flow')
	implementation project(':pipeline:step5-merge')
	implementation project(':pipeline:step6-stitch')
	implementation project(':pipeline:step7-validate-lineage')
	implementation project(':pipeline:step8-export')
	implementation project(':pipeline:step9-publish')

	testImplementation gradleTestKit()
	testImplementation localGroovy()
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	executionData(fileTree(layout.buildDirectory) {
		include 'jacoco/*.exec'
	})
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register('coverage') {
	group = 'verification'
	description = 'Runs tests and generates JaCoCo coverage reports.'
	dependsOn tasks.named('jacocoTestReport')
}

spotless {
	def hasOriginMain = providers.exec {
		commandLine 'git', 'show-ref', '--verify', '--quiet', 'refs/remotes/origin/main'
		ignoreExitValue = true
	}.result.get().exitValue == 0
	ratchetFrom(hasOriginMain ? 'origin/main' : 'HEAD')

	format('misc') {
		target '*.gradle', '.gitattributes', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}

	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

dependencyCheck {
	formats = ['HTML', 'JSON', 'XML']
	failBuildOnCVSS = 7.0f
	skipConfigurations = ['spotbugs', 'spotbugsPlugins']

	if (file('dependency-check-suppressions.xml').exists()) {
		suppressionFile = file('dependency-check-suppressions.xml').absolutePath
	}
	analyzers {
		ossIndex {
			enabled = false
		}
	}

	nvd {
		apiKey = providers.gradleProperty('org.owasp.dependencycheck.nvd.api.key').orNull
				?: System.getenv('NVD_API_KEY')
	}
}

plugins.withId('com.github.spotbugs') {
	dependencies {
		spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
	}

	tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
		ignoreFailures = providers.gradleProperty('spotbugsIgnoreFailures')
				.map { it.toBoolean() }
				.orElse(true)
				.get()
		effort = com.github.spotbugs.snom.Effort.DEFAULT
		reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
		excludeFilter = file('spotbugs-exclude.xml')
		reports.create('html').required = true
		reports.create('xml').required = false
	}
}

gradlePlugin {
	website = 'https://github.com/flowdigger/gradle-lineage-plugin'
	vcsUrl = 'https://github.com/flowdigger/gradle-lineage-plugin.git'
	plugins {
		lineageConventions {
			id = 'org.flowdigger.gradle.lineage'
			implementationClass = 'org.flowdigger.gradle.lineage.LineageConventionsPlugin'
			displayName = 'Lineage pipeline conventions plugin'
			description = 'Externalized and parameterized conventions for the 1.parse..9.publish lineage pipeline.'
			tags.set([
				'lineage',
				'sql',
				'java',
				'graphml',
				'rdf',
				'gradle-plugin',
				'pipeline'
			])
		}
	}
}

publishing {
	publications.withType(MavenPublication).configureEach {
		pom {
			name = 'Lineage pipeline conventions plugin'
			description = 'Externalized and parameterized conventions for 1.parse..9.publish lineage pipeline'
			url = 'https://github.com/flowdigger/gradle-lineage-plugin'

			licenses {
				license {
					name = 'MIT License'
					url = 'https://opensource.org/licenses/MIT'
				}
			}

			developers {
				developer {
					id = 'flowdigger'
					name = 'Flowdigger'
				}
			}

			scm {
				connection = 'scm:git:https://github.com/flowdigger/gradle-lineage-plugin.git'
				developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-lineage-plugin.git'
				url = 'https://github.com/flowdigger/gradle-lineage-plugin'
			}
		}
	}
}

signing {
	def signingKey = providers.gradleProperty('signingKey').orNull
	def signingPassword = providers.gradleProperty('signingPassword').orNull
	def signingKeyId = providers.gradleProperty('signingKeyId').orNull
	def validKeyIdPattern = ~/(?i)^[0-9a-f]{8}([0-9a-f]{8})?$/
	def normalizedSigningKeyId = signingKeyId
			?.trim()
			?.replaceFirst(/^(?i)0x/, '')
	if (!(normalizedSigningKeyId ==~ validKeyIdPattern)) {
		normalizedSigningKeyId = null
	}
	if (signingKey && signingPassword) {
		if (normalizedSigningKeyId) {
			useInMemoryPgpKeys(normalizedSigningKeyId, signingKey, signingPassword)
		} else {
			useInMemoryPgpKeys(signingKey, signingPassword)
		}
	} else {
		useGpgCmd()
	}
	sign publishing.publications
}

def centralStagingRoot = layout.buildDirectory.dir('central-staging-repo')
def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
	dependsOn tasks.named('publishToMavenLocal')
	into(centralStagingRoot)

	publishing.publications.withType(MavenPublication).all { publication ->
		def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
		from(file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")) {
			into(publicationPath)
		}
	}

	doFirst {
		publishing.publications.withType(MavenPublication).each { publication ->
			def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
			def localPublicationDir = file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")
			if (!localPublicationDir.exists()) {
				throw new GradleException("Expected local Maven publication directory not found: ${localPublicationDir}")
			}
		}
	}
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
	dependsOn stageCentralBundleRepo
	doLast {
		def stagedRepoDir = centralStagingRoot.get().asFile
		if (!stagedRepoDir.exists()) {
			throw new GradleException("Expected staged repository directory not found: ${stagedRepoDir}")
		}
		def checksum = { File file, String algorithm ->
			def digest = java.security.MessageDigest.getInstance(algorithm)
			file.withInputStream { input ->
				byte[] buffer = new byte[8192]
				int read
				while ((read = input.read(buffer)) != -1) {
					digest.update(buffer, 0, read)
				}
			}
			digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
		}
		stagedRepoDir.eachFileRecurse { file ->
			if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
				new File(file.parentFile, "${file.name}.md5").text = "${checksum(file, 'MD5')}\n"
				new File(file.parentFile, "${file.name}.sha1").text = "${checksum(file, 'SHA-1')}\n"
			}
		}
	}
}

tasks.register('packageCentralBundle', Zip) {
	dependsOn tasks.named('generateCentralBundleChecksums')
	archiveBaseName.set('gradle-lineage-plugin')
	archiveVersion.set(project.version.toString())
	archiveClassifier.set('central-bundle')
	destinationDirectory.set(layout.buildDirectory.dir('central-bundle'))
	from(layout.buildDirectory.dir('central-staging-repo'))
}
