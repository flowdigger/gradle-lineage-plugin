plugins {
    id 'groovy-gradle-plugin'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'name.jurgenei.gradle'
version = '0.1.0'

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation localGroovy()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        lineageConventions {
            id = 'name.jurgenei.gradle.lineage'
            implementationClass = 'name.jurgenei.gradle.lineage.LineageConventionsPlugin'
            displayName = 'Lineage pipeline conventions plugin'
            description = 'Externalized and parameterized conventions for the 1.parse..9.publish lineage pipeline.'
        }
    }
}
