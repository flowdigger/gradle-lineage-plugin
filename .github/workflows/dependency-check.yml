name: Dependency Check

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:
  schedule:
    - cron: "27 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    uses: flowdigger/github-workflows/.github/workflows/dependency-check.yml@v1.1
    secrets: inherit
    with:
      trigger-event: ${{ github.event_name }}
      upload-reports: true
