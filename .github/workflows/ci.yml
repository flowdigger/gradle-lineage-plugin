name: Build and Test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: gradle

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: flowdigger/gradle-lineage-plugin

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          require_tests: true
          detailed_summary: true
